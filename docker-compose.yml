services:
  db:
    image: pgvector/pgvector:pg16
    container_name: recon-db
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon
    ports:
      # 5432/5433 los usan los Postgres de otros proyectos (gsi-db, sti-db)
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d recon"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
