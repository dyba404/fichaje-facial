<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Kit — Landing Factory (esqueleto probado)</title>
<!--
  KIT DE MOTION PROBADO (derivado de Chifa Doña Lim v3, verificado en navegador 2026-09-27).
  Contiene: intro con lift sincronizado, Lenis, logo flotante, reveals enmascarados,
  parallax interno de fotos, hero Ken Burns, accesibilidad (focus-visible + reduced-motion).
  Marcar con  PERSONALIZAR  lo que cambia por landing. El motor (CSS vars --expo, IO, rAF) no se toca.
-->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Yellowtail&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<style>
  :root{
    /* PERSONALIZAR: tokens del nicho (siempre fondo crema cálido, nunca blanco puro) */
    --crema:#FBF1DF; --rojo:#C8102E; --rojo-osc:#9C0B22; --tinta:#3A2418; --dorado:#D9A441;
    --expo:cubic-bezier(.19,1,.22,1); --suave:cubic-bezier(.4,0,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  html.lenis,html.lenis body{height:auto}
  .lenis.lenis-smooth{scroll-behavior:auto !important}
  body{background:var(--crema);color:var(--tinta);font-family:"Space Mono",monospace;font-size:16px;line-height:1.55;overflow-x:hidden}
  a{color:inherit}
  :focus-visible{outline:3px dashed var(--rojo);outline-offset:3px}
  .display{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.92}

  /* ---- INTRO (2.5-3s, siempre desde arriba) ---- */
  .intro{position:fixed;inset:0;z-index:100;background:var(--rojo);display:grid;place-items:center;animation:introLift 1.1s var(--expo) 1.7s forwards}
  .intro-logo{color:var(--crema);text-align:center;animation:introPop 1s var(--expo) .1s both}
  .intro-logo .n{font-family:"Anton",Impact,sans-serif;font-size:clamp(72px,12vw,150px);line-height:.9;margin:14px 0 10px;text-shadow:6px 6px 0 var(--rojo-osc)}
  .intro-bar{position:absolute;left:0;bottom:0;height:10px;width:100%;background:var(--dorado);transform-origin:left;animation:barra 1.55s linear .1s forwards}
  @keyframes introPop{from{opacity:0;transform:translateY(70px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes introLift{to{transform:translateY(-101%)}}
  @keyframes barra{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  /* ---- HEADER + LOGO FLOTANTE (aparece tras el hero, escala .72 para no tapar) ---- */
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:22px 40px 0;opacity:0;animation:aparecer .8s var(--expo) 2.1s forwards}
  nav ul{list-style:none;display:flex;gap:28px}
  nav.right{justify-content:flex-end}
  nav a{text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta);position:relative}
  nav a::after{content:"";position:absolute;left:0;bottom:-5px;height:2px;width:100%;background:var(--rojo);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--expo)}
  nav a:hover{color:var(--rojo)}
  nav a:hover::after{transform:scaleX(1);transform-origin:left}
  .logo-block{background:var(--rojo);color:var(--crema);text-align:center;padding:26px 44px 30px;margin-top:-22px;box-shadow:0 14px 34px rgba(58,27,18,.35)}
  .logo-block .name{font-family:"Anton",Impact,sans-serif;font-size:40px;line-height:.95;margin:6px 0 4px}
  .logo-flotante{position:fixed;top:0;left:50%;transform:translate(-50%,-110%);opacity:0;z-index:50;transition:transform .7s var(--expo),opacity .5s var(--suave);pointer-events:none}
  .logo-flotante.visible{transform:translate(-50%,0) scale(.72);transform-origin:top center;opacity:1;pointer-events:auto}
  .logo-flotante .logo-block{margin-top:0}
  @keyframes aparecer{from{opacity:0}to{opacity:1}}

  /* ---- HERO (foto real + Ken Burns + parallax + titular enmascarado) ---- */
  .hero{position:relative;min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center;padding:24px 40px 90px;overflow:hidden}
  .hero-bg{position:absolute;inset:-9% 0;z-index:0;will-change:transform}
  .hero-bg img{width:100%;height:100%;object-fit:cover;animation:kenburns 16s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1.03)}to{transform:scale(1.15)}}
  .hero-velo{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(58,27,18,.42),rgba(58,27,18,.18) 45%,rgba(58,27,18,.62))}
  .hero h1{font-size:clamp(64px,12.5vw,196px);color:var(--crema);text-shadow:6px 6px 0 var(--dorado);max-width:12ch;position:relative;z-index:2}
  .linea{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
  .linea > span{display:block;transform:translateY(115%);animation:subir 1.1s var(--expo) forwards}
  .linea:nth-child(1) > span{animation-delay:1.75s}
  .linea:nth-child(2) > span{animation-delay:1.92s}
  @keyframes subir{to{transform:translateY(0)}}

  /* ---- REVEALS + MÁSCARAS (motor de scroll) ---- */
  .reveal{opacity:0;transform:translateY(50px);transition:opacity 1.1s var(--expo),transform 1.1s var(--expo);transition-delay:var(--d,0s)}
  .reveal.visible{opacity:1;transform:translateY(0) rotate(var(--rot,0deg))}
  .mask{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
  .mask > span{display:block;transform:translateY(115%);transition:transform 1.1s var(--expo);transition-delay:var(--d,0s)}
  .visible .mask > span, .mask.visible > span{transform:translateY(0)}

  /* ---- PARALLAX INTERNO DE FOTOS (motor rAF mueve --py) ---- */
  .pw{display:block;overflow:hidden;border-radius:12px}
  .pw img{display:block;width:100%;height:100%;object-fit:cover;transform:translateY(var(--py,0px)) scale(1.14);will-change:transform}
  .plato .pw img{transition:transform .9s var(--expo)}
  .plato:hover .pw img{transform:translateY(var(--py,0px)) scale(1.22)}

  /* ---- FAN DE FOTOS (gesto de firma opcional) ---- */
  .fan{position:relative;height:520px;max-width:1000px;margin:0 auto}
  .fan figure{position:absolute;left:50%;top:50%;width:min(420px,72vw);background:#fff;border:3px solid var(--tinta);border-radius:21.6px;padding:14px;box-shadow:10px 12px 0 rgba(58,27,18,.28);transform:translate(-50%,-50%);transition:transform 1.2s var(--expo);transition-delay:var(--d,0s)}
  .fan figure img{width:100%;height:300px;object-fit:cover;border-radius:12px;display:block}
  .fan.visible figure:nth-child(1){transform:translate(calc(-50% - min(230px,24vw)),-50%) rotate(-7deg)}
  .fan.visible figure:nth-child(2){transform:translate(-50%,-50%) translateY(-12px);z-index:2}
  .fan.visible figure:nth-child(3){transform:translate(calc(-50% + min(230px,24vw)),-50%) rotate(7deg)}

  /* ---- REDUCED MOTION (obligatorio) ---- */
  @media (prefers-reduced-motion: reduce){
    .intro{display:none}
    .hero-bg img,.intro-logo,.intro-bar{animation:none}
    header{opacity:1;animation:none}
    .linea > span{transform:none;animation:none}
    .reveal{opacity:1;transform:rotate(var(--rot,0deg));transition:none}
    .mask > span{transform:none;transition:none}
    .fan figure{transition:none}
    .fan.visible figure{transform:translate(-50%,-50%)}
    .pw img{transform:none;transition:none}
    .logo-flotante{display:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="intro-logo">
    <!-- PERSONALIZAR: marca del nicho -->
    <div class="n">La Marca</div>
  </div>
  <div class="intro-bar" aria-hidden="true"></div>
</div>

<div class="logo-flotante" id="logoFlotante" aria-hidden="true">
  <div class="logo-block"><div class="name">La Marca</div></div>
</div>

<header>
  <nav aria-label="principal"><ul><li><a href="#seccion">Sección</a></li></ul></nav>
  <div class="logo-block"><div class="name">La Marca</div></div>
  <nav class="right" aria-label="secundaria"><ul><li><a href="#contacto">Contacto</a></li></ul></nav>
</header>

<main>
  <section class="hero" aria-label="presentación">
    <div class="hero-bg" id="heroBg">
      <!-- PERSONALIZAR: foto real del nicho, w=1600, fetchpriority high -->
      <img src="https://images.pexels.com/photos/8960427/pexels-photo-8960427.jpeg?auto=compress&cs=tinysrgb&w=1600" alt="Foto del negocio" width="1600" height="1067" fetchpriority="high">
    </div>
    <div class="hero-velo" aria-hidden="true"></div>
    <h1 class="display">
      <span class="linea"><span>Línea uno</span></span>
      <span class="linea"><span>Línea dos</span></span>
    </h1>
  </section>

  <!-- PERSONALIZAR: secciones con .reveal (cascadas con style="--d:.15s") y fotos con .pw + data-parallax -->
  <section id="seccion" style="padding:120px 40px">
    <h2 class="display reveal" style="font-size:clamp(44px,7.5vw,110px)">
      <span class="mask"><span>Título de</span></span>
      <span class="mask" style="--d:.12s"><span>sección</span></span>
    </h2>
    <div style="max-width:340px;margin-top:40px">
      <span class="pw" data-parallax="26">
        <img src="https://images.pexels.com/photos/9738983/pexels-photo-9738983.jpeg?auto=compress&cs=tinysrgb&w=700" alt="Foto de contenido" width="700" height="466" loading="lazy">
      </span>
    </div>
  </section>
</main>

<script>
(function(){
  var reducido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.scrollTo(0, 0);

  var intro = document.getElementById("intro");
  if (reducido) { if (intro) intro.remove(); }
  else { setTimeout(function(){ if (intro) intro.remove(); }, 3000); }

  var lenis = null;
  if (!reducido && typeof Lenis !== "undefined") {
    lenis = new Lenis({ lerp: 0.09, smoothWheel: true });
    function raf(t){ lenis.raf(t); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
  }
  document.querySelectorAll('a[href^="#"]').forEach(function(a){
    a.addEventListener("click", function(ev){
      var dest = document.querySelector(a.getAttribute("href"));
      if (!dest) return;
      ev.preventDefault();
      if (lenis) { lenis.scrollTo(dest, { offset: -20, duration: 1.4 }); }
      else { dest.scrollIntoView({ behavior: reducido ? "auto" : "smooth" }); }
    });
  });

  if ("IntersectionObserver" in window && !reducido) {
    var io = new IntersectionObserver(function(ents){
      ents.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target); } });
    }, { threshold: .14, rootMargin: "0px 0px -6% 0px" });
    document.querySelectorAll(".reveal, .mask").forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll(".reveal, .mask").forEach(function(el){ el.classList.add("visible"); });
  }

  var logoFl = document.getElementById("logoFlotante");
  var pxImgs = Array.prototype.slice.call(document.querySelectorAll("[data-parallax]"));
  var heroBg = document.getElementById("heroBg");
  function frame(){
    var vh = window.innerHeight;
    document.querySelectorAll(".reveal:not(.visible), .mask:not(.visible)").forEach(function(el){
      if (el.getBoundingClientRect().bottom < 0) el.classList.add("visible");
    });
    pxImgs.forEach(function(img){
      var r = img.parentElement.getBoundingClientRect();
      if (r.bottom < 0 || r.top > vh) return;
      var p = (r.top + r.height/2 - vh/2) / vh;
      img.style.setProperty("--py", (p * parseFloat(img.dataset.parallax) * -1).toFixed(1) + "px");
    });
    if (heroBg) {
      var y = window.scrollY;
      heroBg.style.transform = "translateY(" + (y*.16).toFixed(1) + "px) scale(" + Math.max(.94, 1 - y/6000).toFixed(3) + ")";
    }
    if (logoFl) {
      if (window.scrollY > window.innerHeight*.8) logoFl.classList.add("visible");
      else logoFl.classList.remove("visible");
    }
    requestAnimationFrame(frame);
  }
  if (!reducido) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
